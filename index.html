<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="description" content="J.A.R.V.I.S. - personal crypto trading assistant: technical analysis, trade calls with entries, SL and TP, scanner, journal and alerts.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230f1a1f%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2721%27 fill=%27none%27 stroke=%27%2397fce4%27 stroke-width=%275%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%279%27 fill=%27%2397fce4%27/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 fill=%27%230f1a1f%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2721%27 fill=%27none%27 stroke=%27%2397fce4%27 stroke-width=%275%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%279%27 fill=%27%2397fce4%27/%3E%3C/svg%3E">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* Hyperliquid-like terminal: dark teal panels, mint accent, mono numbers */
:root{
  --bg:#0a1418; --panel:#0f1a1f; --panel2:#13232a; --line:#1e2f36; --line2:#2a3f47;
  --text:#f6fefd; --muted:#8a9c9a; --dim:#5d706e;
  --mint:#97fce4; --teal:#50d2c1; --green:#1fa67d; --red:#ed7088; --amber:#f0b95a; --violet:#a78bfa;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
input,select,textarea{font-family:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;font-size:13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--teal)} .down{color:var(--red)} .muted{color:var(--muted)}

/* header */
header{height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:2px;white-space:nowrap}
.logo span{color:var(--mint)}
.logo .dot{width:26px;height:26px;border-radius:50%;flex:none;background:radial-gradient(circle,#fff 0 16%,var(--mint) 20% 32%,transparent 36% 50%,rgba(151,252,228,.75) 54% 62%,transparent 66%);border:2px solid rgba(151,252,228,.55);box-shadow:0 0 18px rgba(151,252,228,.55),inset 0 0 8px rgba(151,252,228,.6);animation:reactor 2.4s ease-in-out infinite}
@keyframes reactor{50%{box-shadow:0 0 30px rgba(151,252,228,.9),inset 0 0 12px rgba(151,252,228,.85)}}
.coinbox,.profbox{position:relative}
#coinBtn{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:7px;font-weight:700;font-size:15px;background:var(--panel2);border:1px solid var(--line2);min-width:118px;justify-content:space-between}
#coinBtn:hover{border-color:var(--teal)}
#coinBtn i{font-style:normal;color:var(--muted);font-size:11px}
.pop{position:absolute;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.55);z-index:30;display:none}
.pop.on{display:flex}
.cpanel{left:0;width:min(520px,calc(100vw - 32px));flex-direction:column;max-height:70vh}
.cpanel .top{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cpanel .top input{width:100%;font-size:16px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{padding:5px 10px;border-radius:5px;font-size:12px;font-weight:600;color:var(--muted);background:var(--panel2)}
.chips button.on{color:#04211b;background:var(--mint)}
.clist{overflow:auto}
.crow{display:grid;grid-template-columns:24px 1fr 1fr 74px 74px;gap:8px;align-items:center;padding:8px 12px;cursor:pointer;font-size:12px}
.crow:hover,.crow.sel{background:var(--panel2)}
.crow.head{cursor:default;color:var(--muted);font-weight:600;font-size:11px;position:sticky;top:0;background:var(--panel)}
.crow .nm{font-weight:700;font-size:13px}
.crow .r{text-align:right;font-family:var(--mono)}
.star{color:var(--dim);font-size:15px;line-height:1}
.star.on{color:var(--amber)}
.tfs,.seg{display:flex;background:var(--panel2);border-radius:7px;padding:3px}
.tfs button,.seg button{padding:5px 10px;border-radius:5px;color:var(--muted);font-weight:600;font-size:12px}
.tfs button.on,.seg button.on{background:var(--line2);color:var(--mint)}
.stats{display:flex;gap:22px;overflow:hidden;flex:1;min-width:0}
.stat{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:14px}
.stat.big .v{font-size:18px;font-weight:700;color:var(--text)}
.hbtn{padding:8px 14px;border-radius:7px;font-weight:600;white-space:nowrap}
.hbtn.primary{background:var(--mint);color:#04211b}
.hbtn.primary:hover{filter:brightness(1.1)}
.hbtn.ghost{border:1px solid var(--line2);color:var(--muted)}
.hbtn.ghost:hover,.hbtn.on{color:var(--mint);border-color:var(--mint)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#04211b;font-size:13px;flex:none;background-size:cover;background-position:center}
.pmenu{right:0;width:290px;flex-direction:column;padding:8px}
.pitem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:7px;cursor:pointer;width:100%;text-align:left;font-size:13px}
.pitem:hover,.pitem.cur{background:var(--panel2)}
.pitem .avatar{width:28px;height:28px;font-size:11px}
.pitem small{display:block;color:var(--muted);font-size:11px}
.psep{height:1px;background:var(--line);margin:6px 0}

/* layout */
main{display:grid;grid-template-columns:1fr 400px;height:calc(100vh - 56px * var(--ui,1))}
.left{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain}
.chartwrap{position:relative;flex:none;height:max(380px, calc(100vh - 56px * var(--ui,1) - 96px - 46px))}
.scrollhint{position:absolute;right:90px;bottom:34px;z-index:4;font-size:12px;color:var(--muted);background:rgba(15,26,31,.85);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;cursor:pointer}
.srcb{font-family:Inter,system-ui,sans-serif;font-weight:600}
.srcb.ok{color:var(--teal)} .srcb.warn{color:var(--amber)}
.fitbtn{position:absolute;right:90px;top:8px;z-index:4;font-size:12px;font-weight:700;color:var(--text);background:rgba(15,26,31,.85);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;cursor:pointer;zoom:var(--ui,1)}
.fitbtn:hover{color:var(--mint);border-color:var(--mint)}
.scrollhint:hover{color:var(--mint);border-color:var(--mint)}
#chart{position:absolute;inset:0}
#overlay{position:absolute;inset:0;pointer-events:none;z-index:3}
.legend{position:absolute;left:10px;top:8px;z-index:4;display:flex;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted);pointer-events:none}
.rsiwrap{height:96px;flex:none;border-top:1px solid var(--line);position:relative}
#rsi{position:absolute;inset:0}
.bottom{flex:none;min-height:calc(100vh - 56px * var(--ui,1));border-top:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
.tabs{position:sticky;top:0;z-index:5;background:var(--panel)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-size:14px;padding:11px 12px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--mint)}
.tabbody{flex:1;padding:12px 16px}
.tabpane{display:none}.tabpane.on{display:block}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}

/* side */
.side{overflow:auto;background:var(--panel)}
.cardwrap{position:relative}
.cardwrap > .card > h3{cursor:pointer;user-select:none}
.cardwrap > .card > h3::before{content:'▾';color:var(--mint);font-size:11px;margin-right:-2px}
.cardwrap > .card.collapsed > h3::before{content:'▸'}
.cardwrap > .card.collapsed > :not(h3){display:none!important}
.cardwrap > .card.collapsed > h3{margin-bottom:0}
.cardctl{display:none;position:absolute;top:6px;right:8px;gap:4px;z-index:3}
.side.editing .cardctl{display:flex}
.side.editing .cardwrap{outline:1px dashed var(--line2);outline-offset:-3px}
.cardwrap.ghost{opacity:.4}
.sidectl{padding:10px 16px;display:flex;justify-content:flex-end}
.card{padding:16px;border-bottom:1px solid var(--line)}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.verdict{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:10px;margin-bottom:10px;font-weight:800;font-size:17px;letter-spacing:.3px}
.verdict small{display:block;font-size:11px;font-weight:700;letter-spacing:.9px;opacity:.75;margin-bottom:3px}
.verdict .badge{font-size:13px;padding:5px 11px}
.vsub{color:var(--text);opacity:.88;margin:-2px 0 12px;line-height:1.45}
.verdict.valid{background:rgba(80,210,193,.12);color:var(--mint);border:1px solid rgba(80,210,193,.35)}
.verdict.watch{background:rgba(240,185,90,.10);color:var(--amber);border:1px solid rgba(240,185,90,.3)}
.verdict.no{background:rgba(237,112,136,.10);color:var(--red);border:1px solid rgba(237,112,136,.3)}
.badge{white-space:nowrap;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:800;letter-spacing:.5px}
.badge.long{background:var(--teal);color:#04211b}
.badge.short{background:var(--red);color:#2a0710}
.badge.idea{background:var(--amber);color:#2a1a00;margin-left:6px}
.mtf{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.mtf span{padding:4px 8px;border-radius:5px;background:var(--panel2);font-family:var(--mono);font-size:11px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-bottom:14px}
.kv .k{color:var(--muted);font-weight:600}
.levels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:12px}
.lvl{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.lvl .t{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.lvl .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-family:var(--mono);font-size:16px;font-weight:600;padding:3px 0}
.lvl .row small{color:var(--muted);font-size:12px;font-weight:500}
.lvl.sl{border-color:rgba(237,112,136,.35)} .lvl.sl .row{color:var(--red)}
.lvl.tp .row{color:var(--teal)}
.rrbar{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.rrbar .big{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--mint)}
.conf{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.conf i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--mint))}
.reasons{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.reasons li{display:flex;gap:8px;line-height:1.45;font-size:14px}
.reasons li .ic{flex:none;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;margin-top:1px}
.reasons li.pos .ic{background:rgba(80,210,193,.18);color:var(--teal)}
.reasons li.neg .ic{background:rgba(237,112,136,.18);color:var(--red)}
.reasons li .w{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}
.note{background:var(--panel2);border-left:3px solid var(--mint);border-radius:0 6px 6px 0;padding:9px 11px;line-height:1.5;margin-bottom:10px;color:#d7e6e4}
.note.warn{border-left-color:var(--amber)} .note.bad{border-left-color:var(--red)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:9px 13px;border-radius:7px;font-weight:600;font-size:13px;border:1px solid var(--line2);color:var(--text)}
.btn:hover{border-color:var(--teal);color:var(--mint)}
.btn.fill{background:var(--mint);color:#04211b;border-color:var(--mint)}
.btn.fill:hover{filter:brightness(1.1);color:#04211b}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{width:100%}
label.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer}
.calcout{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-family:var(--mono);font-size:14px}
.calcout .k{color:var(--muted);font-family:Inter,system-ui,sans-serif}
.indgrid{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;font-size:14px;align-items:center}
.indgrid .n{color:var(--muted);font-weight:600;white-space:nowrap}
.indgrid .val{font-family:var(--mono);text-align:right;white-space:nowrap}
.dotc{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--dim)}
.dotc.up{background:var(--teal)} .dotc.down{background:var(--red)}
.ai{line-height:1.6;color:#dbe9e7}
.ai b{color:var(--mint)}
.ai ul{padding-left:18px;margin:4px 0 8px}
.ai p{margin:4px 0 8px}
.ai .src{font-size:11px;color:var(--muted);margin-top:8px}
.ai .src a{color:var(--teal);text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idea{display:grid;grid-template-columns:1fr 260px;gap:14px}
.idea textarea{width:100%;height:120px;resize:vertical}
.idea .opts{display:flex;flex-direction:column;gap:8px}
.tform{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-bottom:12px;align-items:end}
#equity,#dEquity,#btEquity{width:100%;height:64px;display:block;margin-bottom:10px}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--mint);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.mnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.mnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.mnav button b{font-size:18px;font-weight:400;line-height:1}
.mnav button.on{color:var(--mint)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:10px 16px;border-radius:8px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50;padding:16px}
.modal.on{display:grid}
.pbox{width:min(1120px,100%)!important}
#pfChart{width:100%;height:220px;display:block}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:20px;width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:16px}
.spane{display:none;flex-direction:column;gap:12px}.spane.on{display:flex}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.hint code,.note code{font-family:var(--mono);color:var(--mint)}
.colors{display:flex;gap:8px}
.colors button{width:26px;height:26px;border-radius:50%;border:2px solid transparent}
.colors button.on{border-color:var(--text)}
.disc{font-size:11px;color:var(--dim);padding:12px 16px;line-height:1.5}
.stattiles{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.stattiles div{background:var(--panel2);border-radius:7px;padding:7px 12px}
.stattiles small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.stattiles b{font-family:var(--mono);font-size:16px}
.pill{padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;font-family:Inter,system-ui,sans-serif}
.pill.valid,.pill.tp2,.pill.tp1,.pill.win{background:rgba(80,210,193,.15);color:var(--teal)}
.pill.watch,.pill.open,.pill.filled,.pill.be{background:rgba(240,185,90,.12);color:var(--amber)}
.pill.no,.pill.sl,.pill.loss{background:rgba(237,112,136,.12);color:var(--red)}
.pill.missed,.pill.expired{background:var(--line);color:var(--muted)}
.feed{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.feed b{color:var(--mint)}
details.fold > summary{list-style:none;cursor:pointer}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary h3{margin-bottom:0}
details.fold[open] > summary h3{margin-bottom:12px}
details.fold > summary .chev{display:inline-block;transition:transform .15s;margin-right:6px;color:var(--mint)}
details.fold[open] > summary .chev{transform:rotate(90deg)}
.tip{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line2);color:var(--muted);font-size:10px;font-weight:800;cursor:help;margin-left:6px;vertical-align:1px;font-family:Inter,system-ui,sans-serif;letter-spacing:0;text-transform:none;flex:none;line-height:1}
.tip:hover,.tip:focus{color:#04211b;background:var(--mint);border-color:var(--mint);outline:none}
#tipBox{position:fixed;z-index:80;max-width:min(330px,calc(100vw - 24px));background:#1a2d35;border:1px solid var(--line2);color:var(--text);padding:10px 12px;border-radius:8px;font-size:calc(13px * var(--ui,1));line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none;display:none}
#tipBox b{color:var(--mint)}
#cfText{white-space:pre-line;line-height:1.55;font-size:14px}
.netb{padding:3px 8px;border-radius:5px;font-size:11px;font-weight:800;letter-spacing:.5px}
.netb.testnet{background:rgba(167,139,250,.18);color:var(--violet)} .netb.mainnet{background:rgba(237,112,136,.18);color:var(--red)}
.sub{font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 8px;text-transform:uppercase;letter-spacing:.6px}

header,.side,.bottom,.modal .box,.toast,.legend,.scrollhint{zoom:var(--ui,1)}
@media (max-width:1050px){
  html,body{height:auto}
  .scrollhint{display:none}
  .tabs{position:static}
  .bottom{min-height:0}
  body{overflow-x:hidden;overflow-y:auto}
  header{height:auto;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:max(10px,env(safe-area-inset-top,0px));gap:8px 10px;position:sticky;top:0;z-index:20}
  .stats{order:5;flex-basis:100%;overflow-x:auto;gap:16px;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  main{display:flex;flex-direction:column;height:auto}
  .left{display:contents}
  .chartwrap{order:1;height:min(58vh,460px);flex:none}
  .rsiwrap{order:2;height:72px}
  .side{order:3;overflow:visible;border-top:1px solid var(--line)}
  .bottom{order:4;height:auto;min-height:0}
  .tabbody{overflow:visible}
  .idea{grid-template-columns:1fr}
  input,select,textarea{font-size:16px}
}
@media (max-width:640px){
  .logo{font-size:0;gap:0;letter-spacing:0}
  .logo .dot{width:30px;height:30px}
  .hbtn{padding:8px 10px;font-size:12px}
  #btnSettings,#btnAlerts{font-size:0;padding:8px 11px}
  #btnSettings::before{content:'⚙';font-size:15px}
  #btnAlerts::before{content:'🔕';font-size:15px}
  #btnAlerts.on::before{content:'🔔'}
  #langSw{display:none}
  .tfs{order:4}
  .tfs button{padding:6px 11px}
  #btnAnalyze{margin-left:auto}
  .legend{display:none}
  .card{padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
  .tabbody{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .crow{grid-template-columns:22px 1fr 1fr 64px}
  .crow > :nth-child(5){display:none}
  td,th{padding:6px}
  .row2{grid-template-columns:1fr}
  header{position:static}
  .chartwrap{height:min(52vh,420px)}
  .tabs{flex-wrap:wrap;padding:4px 8px;gap:0}
  .tabs button{padding:8px 9px;font-size:13px}
  #topCard td:nth-child(5){display:none}
  .card .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .card .btnrow .btn{justify-content:center;text-align:center}
  .lvl{min-width:0}
  .mnav{display:flex}
  #viewBar{position:static!important;font-size:12px;padding:6px 12px!important;gap:8px!important}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){ .logo .dot,.spin{animation:none} }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="dot"></div>J.A.R.V.I.S<span>.</span></div>
  <div class="coinbox">
    <button id="coinBtn" aria-label="Coin"><span>BTC</span><i>▼</i></button>
    <div class="pop cpanel" id="cpanel">
      <div class="top">
        <input id="coinSearch" data-i18n-ph="search" spellcheck="false" autocomplete="off">
        <div class="chips" id="cfilters">
          <button data-f="all" class="on" data-i18n="fAll"></button><button data-f="fav" data-i18n="fFav"></button><button data-f="gain" data-i18n="fGain"></button><button data-f="lose" data-i18n="fLose"></button><button data-f="meme">🐸 Memes</button>
        </div>
      </div>
      <div class="clist" id="clist"></div>
    </div>
  </div>
  <div class="tfs" id="tfs">
    <button data-tf="15m">15m</button><button data-tf="1h">1h</button><button data-tf="4h">4h</button><button data-tf="1d">1D</button>
  </div>
  <div class="stats">
    <div class="stat big"><span class="l">Mark</span><span class="v" id="sMark">–</span></div>
    <div class="stat"><span class="l">24h</span><span class="v" id="sChg">–</span></div>
    <div class="stat"><span class="l">Funding / 1h</span><span class="v" id="sFund">–</span></div>
    <div class="stat"><span class="l">Open Interest</span><span class="v" id="sOI">–</span></div>
    <div class="stat"><span class="l" data-i18n="vol24"></span><span class="v" id="sVol">–</span></div>
  </div>
  <div class="seg" id="langSw"><button data-lang="en">EN</button><button data-lang="sk">SK</button></div>
  <button class="hbtn ghost" id="btnAlerts"></button>
  <button class="hbtn ghost" id="btnSettings" data-i18n="settings"></button>
  <button class="hbtn primary" id="btnAnalyze" data-i18n="analyze"></button>
  <div class="profbox">
    <button class="avatar" id="profBtn" aria-label="Profile"></button>
    <div class="pop pmenu" id="pmenu"></div>
  </div>
</header>

<main>
  <section class="left">
    <div class="chartwrap">
      <div id="chart"></div>
      <canvas id="overlay"></canvas>
      <div class="legend"><span><b style="color:#97fce4">━</b> EMA21</span><span><b style="color:#f0b95a">━</b> EMA50</span><span><b style="color:#a78bfa">━</b> EMA200</span><span data-i18n="zoomHint"></span><span id="srcBadge" class="srcb ok">● Hyperliquid</span><span id="lgStatus"></span></div>
      <button class="scrollhint" id="toTabs" data-i18n="toTabs"></button>
      <button class="fitbtn" id="fitBtn" title="Fit (F)">⤢ Fit</button>
    </div>
    <div class="rsiwrap"><div id="rsi"></div></div>
    <div class="bottom">
      <div class="tabs" id="tabs">
        <button data-tab="idea" class="on" data-i18n="tabIdea"></button>
        <button data-tab="scan" data-i18n="tabScan"></button>
        <button data-tab="bt" data-i18n="tabBt"></button>
        <button data-tab="trades" data-i18n="tabTrades"></button>
        <button data-tab="demo" data-i18n="tabDemo"></button>
        <button data-tab="real" data-i18n="tabReal"></button>
        <button data-tab="journal" data-i18n="tabCalls"></button>
        <button data-tab="live" data-i18n="tabLive"></button>
      </div>
      <div class="tabbody">
        <div class="tabpane on" id="tab-idea">
          <div class="idea">
            <textarea id="ideaText" data-i18n-ph="ideaPh"></textarea>
            <div class="opts">
              <label class="f"><span data-i18n="direction"></span><select id="ideaDir"><option value="auto" data-i18n="dirAuto"></option><option value="long">Long 🟢</option><option value="short">Short 🔴</option></select></label>
              <label class="f"><span data-i18n="entryOpt"></span><input id="ideaEntry" class="mono" inputmode="decimal" placeholder="80000"></label>
              <div class="btnrow"><button class="btn fill" id="btnIdea" data-i18n="checkIdea"></button><button class="btn" id="btnIdeaAI" data-i18n="askAI"></button></div>
            </div>
          </div>
          <div id="ideaOut" style="margin-top:12px"></div>
        </div>

        <div class="tabpane" id="tab-scan">
          <div class="btnrow" style="margin-bottom:10px"><button class="btn fill" id="btnScan" data-i18n="scanBtn"></button><label class="chk muted"><input type="checkbox" id="autoScan"> <span data-i18n="autoScan"></span></label><span class="muted" id="scanInfo" data-i18n="scanHint"></span></div>
          <div class="tscroll"><table><thead><tr><th>Coin</th><th data-i18n="thDir"></th><th data-i18n="thScore"></th><th>Entry</th><th>SL</th><th>RR</th><th data-i18n="thVerdict"></th></tr></thead><tbody id="scanBody"></tbody></table></div>
        </div>

        <div class="tabpane" id="tab-bt">
          <div class="hint" style="margin-bottom:10px" data-i18n="btHint"></div>
          <div class="tform">
            <label class="f"><span data-i18n="btScope"></span><select id="btScope"><option value="1" data-i18n="btThis"></option><option value="10">Top 10</option><option value="30">Top 30</option></select></label>
            <label class="f">Timeframe<select id="btTf"><option value="15m">15m</option><option value="1h">1h</option><option value="4h">4h</option></select></label>
            <label class="f"><span data-i18n="aMin"></span><input id="btMin" class="mono" type="number" step="0.5" min="5" max="16"></label>
            <div class="btnrow"><button class="btn fill" id="btRun" data-i18n="btRun"></button><button class="btn danger" id="btStop" hidden data-i18n="btStop"></button></div>
          </div>
          <div class="hint" id="btInfo" style="margin-bottom:8px"></div>
          <div class="stattiles" id="btStats"></div>
          <div class="note" id="btPlain" hidden></div>
          <canvas id="btEquity" hidden></canvas>
          <div class="note" id="btGoal" hidden style="border-left-color:var(--amber)"></div>
          <div class="tscroll" id="btCoinsWrap" hidden><table><thead><tr><th>Coin</th><th data-i18n="btTrades"></th><th>Winrate</th><th data-i18n="btAvgR"></th><th data-i18n="btTotalR"></th></tr></thead><tbody id="btCoins"></tbody></table></div>
          <div class="sub" id="btListT" hidden data-i18n="btList"></div>
          <div class="tscroll"><table><tbody id="btList"></tbody></table></div>
        </div>
        <div class="tabpane" id="tab-trades">
          <div class="stattiles" id="tStats"></div>
          <canvas id="equity"></canvas>
          <form class="tform" id="tForm" autocomplete="off">
            <label class="f">Coin<input id="tCoin" required></label>
            <label class="f"><span data-i18n="direction"></span><select id="tDir"><option value="long">Long</option><option value="short">Short</option></select></label>
            <label class="f">Entry<input id="tEntry" class="mono" inputmode="decimal" required></label>
            <label class="f">SL<input id="tSL" class="mono" inputmode="decimal"></label>
            <label class="f">TP<input id="tTP" class="mono" inputmode="decimal"></label>
            <label class="f"><span data-i18n="sizeUsd"></span><input id="tSize" class="mono" inputmode="decimal" required></label>
            <label class="f"><span data-i18n="leverage"></span><input id="tLev" class="mono" inputmode="decimal" value="5"></label>
            <label class="f"><span data-i18n="exitOpt"></span><input id="tExit" class="mono" inputmode="decimal"></label>
            <label class="f" style="grid-column:span 2"><span data-i18n="notes"></span><input id="tNotes"></label>
            <div class="btnrow"><button class="btn fill" type="submit" id="tSubmit" data-i18n="addTrade"></button><button class="btn" type="button" id="tLive">💰 <span data-i18n="tLive"></span></button><button class="btn" type="button" id="tCancel" hidden data-i18n="cancel"></button></div>
          </form>
          <div class="tscroll"><table><thead><tr><th data-i18n="thDate"></th><th>Coin</th><th data-i18n="thDir"></th><th>Entry</th><th>Exit</th><th>SL</th><th data-i18n="thSize"></th><th>PnL</th><th>R</th><th></th></tr></thead><tbody id="tBody"></tbody></table></div>
        </div>

        <div class="tabpane" id="tab-demo">
          <div class="hint" style="margin-bottom:8px" data-i18n="demoHint"></div>
          <div class="btnrow" style="justify-content:flex-end;margin-bottom:6px"><button class="btn sm" data-openpf="demo">📊 Portfolio</button></div>
          <div class="stattiles" id="dStats"></div>
          <canvas id="dEquity"></canvas>
          <div class="note" style="border-left-color:var(--violet)" id="autoBox">
            <div class="btnrow" style="justify-content:space-between"><label class="chk"><input type="checkbox" id="aOn"> <b data-i18n="autoTitle"></b><span class="tip" tabindex="0" data-tip="auto">?</span></label><span class="btnrow"><button class="btn sm" type="button" id="aPreset">⭐ <span data-i18n="aPreset"></span></button><span class="hint" id="aStatus"></span></span></div>
            <div class="tform" style="margin:10px 0 6px">
              <label class="f"><span data-i18n="aRisk"></span><input id="aRisk" class="mono" type="number" step="0.1" min="0.1" max="5"></label>
              <label class="f"><span data-i18n="aMax"></span><input id="aMax" class="mono" type="number" min="1" max="10"></label>
              <label class="f"><span data-i18n="aDay"></span><input id="aDay" class="mono" type="number" step="0.5" min="0.5" max="20"></label>
              <label class="f"><span data-i18n="aMin"></span><input id="aMin" class="mono" type="number" step="0.5" min="5" max="16"></label>
              <label class="f">Timeframe<select id="aTf"><option value="4h+1h">4h + 1h (best)</option><option value="4h">4h</option><option value="1h">1h</option></select></label>
              <label class="f"><span data-i18n="aEvery"></span><select id="aEvery"><option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option><option value="30">30 min</option></select></label>
            </div>
            <label class="chk" style="margin-bottom:6px"><input type="checkbox" id="aLive"> <b data-i18n="aLive"></b></label>
            <div class="hint" data-i18n="autoHint"></div>
          </div>
          <div class="sub" data-i18n="openPos"></div>
          <div class="tscroll"><table><thead><tr><th>Coin</th><th data-i18n="thDir"></th><th data-i18n="thStatus"></th><th>Entry</th><th data-i18n="thSize"></th><th>SL</th><th>TP1 / TP2</th><th>PnL</th><th></th></tr></thead><tbody id="dOpen"></tbody></table></div>
          <div class="sub" data-i18n="history"></div>
          <div class="tscroll"><table><thead><tr><th data-i18n="thDate"></th><th>Coin</th><th data-i18n="thDir"></th><th>Entry</th><th>Exit</th><th>PnL</th><th>R</th><th data-i18n="thStatus"></th></tr></thead><tbody id="dHist"></tbody></table></div>
          <div class="btnrow" style="margin-top:12px"><label class="f" style="width:170px"><span data-i18n="demoStart"></span><input id="dStart" class="mono" type="number" min="100" step="100"></label><button class="btn danger" id="dReset" data-i18n="demoReset" style="align-self:flex-end"></button></div>
        </div>
        <div class="tabpane" id="tab-real"><div class="btnrow" style="justify-content:flex-end;margin-bottom:6px"><button class="btn sm" data-openpf="live">📊 Portfolio</button></div><div id="liveBox"></div></div>
        <div class="tabpane" id="tab-journal">
          <div class="stattiles" id="jStats"></div>
          <div class="tscroll"><table><thead><tr><th data-i18n="thDate"></th><th>Coin</th><th>TF</th><th data-i18n="thDir"></th><th>Entry</th><th>SL</th><th>TP1 / TP2</th><th data-i18n="thStatus"></th><th>R</th><th></th></tr></thead><tbody id="jBody"></tbody></table></div>
        </div>

        <div class="tabpane" id="tab-live">
          <div class="sub" data-i18n="priceAlerts"></div>
          <form class="btnrow" id="paForm" style="margin-bottom:8px" autocomplete="off">
            <input id="paCoin" style="width:110px" placeholder="Coin" required>
            <input id="paPrice" class="mono" style="width:140px" inputmode="decimal" data-i18n-ph="price" required>
            <input id="paNote" style="flex:1;min-width:140px" data-i18n-ph="noteOpt">
            <button class="btn fill" type="submit" data-i18n="addAlert"></button>
          </form>
          <div id="paList"></div>
          <div class="sub" data-i18n="liveFeed"></div>
          <div class="hint" style="margin-bottom:6px" data-i18n="liveHint"></div>
          <div id="liveFeed"></div>
        </div>
      </div>
    </div>
  </section>

  <aside class="side">
    <div class="card" id="topCard"><h3><span>🔥 <span data-i18n="topTitle"></span><span class="tip" tabindex="0" data-tip="top">?</span></span><button class="btn sm" id="topRefresh" title="Refresh">↻</button></h3><div id="topList" class="hint"></div></div>
    <div class="card" id="callCard"><div class="empty"><span class="spin"></span> <span data-i18n="loading"></span></div></div>
    <div class="card" id="indCard"></div>
    <div class="card" id="calcCard">
      <h3><span><span data-i18n="posSize"></span><span class="tip" tabindex="0" data-tip="pos">?</span></span></h3>
      <div class="calc">
        <label class="f"><span data-i18n="account"></span><input id="cAcc" class="mono" type="number" min="0" inputmode="decimal"></label>
        <label class="f"><span data-i18n="riskPct"></span><input id="cRisk" class="mono" type="number" min="0" step="0.1" inputmode="decimal"></label>
      </div>
      <div class="calcout" id="calcOut"></div>
    </div>
    <div class="card" id="macroCard"><h3><span><span data-i18n="macroTitle"></span><span class="tip" tabindex="0" data-tip="macro">?</span></span></h3><div id="macroList" class="hint"></div></div>
    <div class="card" id="aiCard">
      <h3><span data-i18n="aiTitle"></span> <button class="btn" id="btnAI" data-i18n="askAI"></button></h3>
      <div class="ai" id="aiOut"><span class="muted" data-i18n="aiHint"></span></div>
    </div>
    <div class="sidectl"><button class="btn sm" id="editSide"></button></div>
    <div class="disc" data-i18n="disc"></div>
  </aside>
</main>
<nav class="mnav" id="mnav">
  <button data-go="chart"><b>📈</b><span data-i18n="navChart"></span></button>
  <button data-go="call"><b>🎯</b><span data-i18n="navCall"></span></button>
  <button data-go="top"><b>🔥</b><span data-i18n="navTop"></span></button>
  <button data-go="trades"><b>💼</b><span data-i18n="navTrades"></span></button>
  <button data-go="demo"><b>🧪</b><span data-i18n="navDemo"></span></button>
  <button data-go="idea"><b>☰</b><span data-i18n="navMore"></span></button>
</nav>

<!-- settings -->
<div class="modal" id="mSettings">
  <div class="box">
    <h2 data-i18n="settings"></h2>
    <div class="chips" id="stabs">
      <button data-s="general" class="on" data-i18n="stGeneral"></button><button data-s="risk" data-i18n="stRisk"></button><button data-s="alerts" data-i18n="stAlerts"></button><button data-s="chart" data-i18n="stChart"></button><button data-s="ai">AI</button><button data-s="hl">💰 Hyperliquid</button><button data-s="cloud" data-i18n="stCloud"></button>
    </div>
    <div class="spane on" data-s="general">
      <label class="f"><span data-i18n="profileName"></span><input id="sName" maxlength="30"></label>
      <label class="f"><span data-i18n="language"></span><select id="sLang"><option value="en">English</option><option value="sk">Slovenčina</option></select></label>
      <label class="f"><span data-i18n="textSize"></span><select id="sScale"><option value="0.9">90 %</option><option value="1">100 %</option><option value="1.1">110 %</option><option value="1.25">125 %</option><option value="1.4">140 %</option><option value="1.6">160 %</option></select></label>
      <div class="f"><span class="hint" data-i18n="color"></span><div class="colors" id="sColors"></div></div>
    </div>
    <div class="spane" data-s="risk">
      <div class="row2">
        <label class="f"><span data-i18n="account"></span><input id="sAcc" class="mono" type="number" min="0"></label>
        <label class="f"><span data-i18n="riskPct"></span><input id="sRisk" class="mono" type="number" min="0" step="0.1"></label>
      </div>
      <div class="row2">
        <label class="f"><span data-i18n="maxLev"></span><input id="sMaxLev" class="mono" type="number" min="1" max="100"></label>
        <label class="f"><span data-i18n="minScore"></span><input id="sMinScore" class="mono" type="number" min="4" max="14" step="0.5"></label>
        <label class="f"><span data-i18n="adxMin"></span><select id="sAdx"><option value="0">Off</option><option value="15">ADX ≥ 15</option><option value="20">ADX ≥ 20</option><option value="25">ADX ≥ 25</option></select></label>
      </div>
      <div class="hint" data-i18n="minScoreHint"></div>
    </div>
    <div class="spane" data-s="alerts">
      <label class="chk"><input type="checkbox" id="sSound"> <span data-i18n="sound"></span></label>
      <label class="f"><span data-i18n="scanEvery"></span><select id="sScanMin"><option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option><option value="30">30 min</option></select></label>
      <div class="btnrow"><button class="btn" id="sNotif" type="button" data-i18n="enableNotif"></button><span class="hint" id="sNotifState"></span></div>
      <div class="hint" data-i18n="alertsHint"></div>
    </div>
    <div class="spane" data-s="chart">
      <label class="chk"><input type="checkbox" id="sPat"> <span data-i18n="showPat"></span></label>
      <label class="chk"><input type="checkbox" id="sVP"> Volume profile (POC / VAH / VAL)</label>
      <label class="chk"><input type="checkbox" id="sZones"> <span data-i18n="showZones"></span></label>
      <label class="chk"><input type="checkbox" id="sEMA"> EMA 21 / 50 / 200</label>
      <label class="chk"><input type="checkbox" id="sBox"> <span data-i18n="showBox"></span></label>
      <div class="sub" style="margin:6px 0 0" data-i18n="panels"></div>
      <label class="chk"><input type="checkbox" id="sInd"> <span data-i18n="pInd"></span></label>
      <label class="chk"><input type="checkbox" id="sWhy"> <span data-i18n="pWhy"></span></label>
      <label class="chk"><input type="checkbox" id="sTop"> 🔥 <span data-i18n="topTitle"></span></label>
      <label class="chk"><input type="checkbox" id="sCalc"> <span data-i18n="posSize"></span></label>
      <label class="chk"><input type="checkbox" id="sAI"> <span data-i18n="aiTitle"></span></label>
      <label class="chk"><input type="checkbox" id="sMacro"> <span data-i18n="macroTitle"></span></label>
    </div>
    <div class="spane" data-s="ai">
      <label class="f"><span data-i18n="apiKey"></span><input id="sKey" type="password" placeholder="sk-ant-..." autocomplete="off"></label>
      <div class="hint" data-i18n="apiKeyHint"></div>

function loadJSON(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function saveJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function fmt(p){
  if(p == null || !isFinite(p)) return '–';
  const a = Math.abs(p);
  const d = a >= 10000 ? 1 : a >= 100 ? 2 : a >= 10 ? 3 : a >= 1 ? 4 : a >= 0.01 ? 5 : 7;
  return p.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtUsd(v, sign){
  if(v == null || !isFinite(v)) return '–';
  const a = Math.abs(v), s = sign ? (v >= 0 ? '+' : '-') : (v < 0 ? '-' : '');
  if(a >= 1e9) return s + '$' + (a/1e9).toFixed(2) + 'B';
  if(a >= 1e6) return s + '$' + (a/1e6).toFixed(2) + 'M';
  if(a >= 1e4) return s + '$' + (a/1e3).toFixed(1) + 'K';
  return s + '$' + a.toFixed(2);
}
const pct = (a, b) => (a/b - 1) * 100;
const num = v => { const n = parseFloat(String(v ?? '').replace(/[\s,$]/g, '')); return isFinite(n) ? n : null; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2800); }
function askConfirm(text){

profiles.forEach(p => { p.settings = {...DEF_SETTINGS, ...(p.settings || {})}; p.journal ||= []; p.trades ||= []; p.priceAlerts ||= []; p.paper ||= newPaper(); const oldAuto = !p.paper.auto?.v2, oldV3 = !p.paper.auto?.v3; p.paper.auto = {...DEF_AUTO, ...(p.paper.auto || {})}; p.paper.brackets ||= []; p.paper.history ||= [];

}

/* ============================================================
   Market data (Hyperliquid public API: free, real time, 150+ perps incl. alts & memes)
   ============================================================ */
const API = 'https://api.hyperliquid.xyz/info';
const TFMS = {'5m':3e5, '15m':9e5, '1h':36e5, '4h':144e5, '1d':864e5, '1w':6048e5};

/* ---- Hyperliquid request queue: max 2 at once with spacing, so we never flood the API ---- */
const hlQ = {active:0, last:0, waiting:[]};
async function hlSlot(){
  while(hlQ.active >= 2 || Date.now() - hlQ.last < 120){ await new Promise(r => { hlQ.waiting.push(r); setTimeout(r, 130); }); }
  hlQ.active++; hlQ.last = Date.now();
}
function hlFree(){ hlQ.active--; const w = hlQ.waiting.shift(); if(w) w(); }
async function info(body){
  for(let attempt = 0; ; attempt++){
    await hlSlot();
    let r; try{ r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); } finally{ hlFree(); }
    if(r.status === 429 && attempt < 2){ srcDown('hl', 20000); await new Promise(res => setTimeout(res, 1200 * (attempt + 1))); continue; }
    if(!r.ok) throw new Error('API ' + r.status);
    return r.json();
  }
}

/* ---- candle sources: Hyperliquid (live, matches trading), Binance & Bybit perps (fallback / bulk scans) ---- */
const srcHealth = {hl:0, binance:0, bybit:0}; // timestamp until which a source is skipped
const srcDown = (s, ms) => { srcHealth[s] = Math.max(srcHealth[s], Date.now() + ms); };
const extSym = coin => (/^k[A-Z]/.test(coin) ? '1000' + coin.slice(1) : coin).toUpperCase() + 'USDT'; // kPEPE -> 1000PEPEUSDT
async function hlCandles(coin, interval, start, end){
  const d = await info({type:'candleSnapshot', req:{coin, interval, startTime:start, endTime:end}});
  return d.map(k => ({t:k.t, o:+k.o, h:+k.h, l:+k.l, c:+k.c, v:+k.v}));
}
const noSym = {binance:new Set(), bybit:new Set()}; // coins a backup exchange doesn't list
async function binanceCandles(coin, interval, start, end){
  if(noSym.binance.has(coin)) throw new Error('not on Binance');
  const out = []; let from = start;
  for(let page = 0; page < 6 && from < end; page++){
    const r = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${extSym(coin)}&interval=${interval}&startTime=${Math.floor(from)}&endTime=${Math.floor(end)}&limit=1500`);
    if(r.status === 429 || r.status === 418){ srcDown('binance', 60000); throw new Error('Binance busy'); }
    if(r.status === 400){ noSym.binance.add(coin); throw new Error('not on Binance'); }
    if(!r.ok) throw new Error('Binance ' + r.status);
    const d = await r.json(); if(!d.length) break;
    for(const k of d) out.push({t:k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5]});
    from = d.at(-1)[0] + TFMS[interval];
    if(d.length < 1500) break;
  }
  return out;
}
async function bybitCandles(coin, interval, start, end){

  let to = end;

    const r = await fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${extSym(coin)}&interval=${iv}&start=${Math.floor(start)}&end=${Math.floor(to)}&limit=1000`);
    if(r.status === 429){ srcDown('bybit', 60000); throw new Error('Bybit busy'); }
    const d = await r.json(); const list = d?.result?.list || [];
    if(d.retCode !== 0){ if(/symbol/i.test(d.retMsg || '')) noSym.bybit.add(coin); throw new Error('Bybit ' + d.retMsg); }
    if(!list.length) break;
    for(const k of list) out.push({t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5]});
    to = +list.at(-1)[0] - 1;

const candleCache = new Map(); // coin|tf -> {at, data}
const dataSrc = {last:'hl'};
async function fetchCandles(coin, interval, n, startTime, opts = {}){
  const end = Date.now(), ms = TFMS[interval], start = startTime ?? end - n * ms, key = coin + '|' + interval;
  const ttl = interval === '5m' || interval === '15m' ? 20000 : 45000;
  const hit = candleCache.get(key);
  if(startTime == null && hit && end - hit.at < ttl && hit.data.length && hit.data[0].t <= start + ms) return hit.data.filter(c => c.t >= start - ms);
  const order = opts.bulk ? ['binance', 'hl', 'bybit'] : ['hl', 'binance', 'bybit'];
  const fns = {hl:hlCandles, binance:binanceCandles, bybit:bybitCandles};
  let lastErr;
  for(const src of order){
    if(srcHealth[src] > end && src !== order.at(-1)) continue;
    try{
      const data = await fns[src](coin, interval, start, end);
      if(!data.length) throw new Error('no data');
      if(startTime == null && (!hit || data.length >= hit.data.length || end - hit.at >= ttl)) candleCache.set(key, {at:end, data});
      if(!opts.bulk && coin === state.coin){ dataSrc.last = src; renderSrc(); }
      return data.slice(); // callers may mutate their copy (live candles), never the cache
    }catch(e){ lastErr = e; if(src === 'hl') srcDown('hl', 30000); }
  }
  throw lastErr || new Error('No data source available');
}

function resample(C, ms){
  const out = [];
  for(const c of C){
    const t = Math.floor(c.t / ms) * ms, last = out[out.length-1];
    if(last && last.t === t){ last.h = Math.max(last.h, c.h); last.l = Math.min(last.l, c.l); last.c = c.c; last.v += c.v; }
    else out.push({t, o:c.o, h:c.h, l:c.l, c:c.c, v:c.v});
  }
  return out;
}

/* ============================================================
   Indicators
   ============================================================ */
function ema(a, n){
  const out = new Array(a.length).fill(null);
  if(a.length < n) return out;
  const k = 2/(n+1); let s = 0;
  for(let i=0;i<n;i++) s += a[i];
  let e = s/n; out[n-1] = e;
  for(let i=n;i<a.length;i++){ e = a[i]*k + e*(1-k); out[i] = e; }
  return out;
}
function smaN(a, n){
  const out = new Array(a.length).fill(null);
  for(let i=n-1;i<a.length;i++){
    let s = 0, ok = true;
    for(let j=i-n+1;j<=i;j++){ if(a[j] == null){ ok = false; break; } s += a[j]; }
    if(ok) out[i] = s/n;
  }
  return out;
}
function rsi(c, n=14){
  const out = new Array(c.length).fill(null);
  if(c.length <= n) return out;
  let g = 0, l = 0;
  for(let i=1;i<=n;i++){ const d = c[i]-c[i-1]; if(d > 0) g += d; else l -= d; }
  g /= n; l /= n;
  out[n] = l === 0 ? 100 : 100 - 100/(1 + g/l);
  for(let i=n+1;i<c.length;i++){
    const d = c[i]-c[i-1];
    g = (g*(n-1) + Math.max(d,0))/n; l = (l*(n-1) + Math.max(-d,0))/n;
    out[i] = l === 0 ? 100 : 100 - 100/(1 + g/l);
  }
  return out;
}
function atr(C, n=14){
  const out = new Array(C.length).fill(null);
  if(C.length <= n) return out;
  const tr = C.map((c,i) => i === 0 ? c.h - c.l : Math.max(c.h - c.l, Math.abs(c.h - C[i-1].c), Math.abs(c.l - C[i-1].c)));
  let a = 0; for(let i=1;i<=n;i++) a += tr[i]; a /= n; out[n] = a;
  for(let i=n+1;i<C.length;i++){ a = (a*(n-1) + tr[i])/n; out[i] = a; }
  return out;
}
function macd(c){
  const e12 = ema(c,12), e26 = ema(c,26);
  const line = c.map((_,i) => e12[i] != null && e26[i] != null ? e12[i] - e26[i] : null);
  const first = line.findIndex(v => v != null), hist = new Array(c.length).fill(null);
  if(first >= 0){ const sig = ema(line.slice(first), 9); sig.forEach((v,j) => { if(v != null) hist[first+j] = line[first+j] - v; }); }
  return hist;
}
function bollinger(cl, n=20, k=2){
  const m = smaN(cl, n), up = [], lo = [], w = [];
  for(let i=0;i<cl.length;i++){
    if(m[i] == null){ up.push(null); lo.push(null); w.push(null); continue; }
    let v = 0; for(let j=i-n+1;j<=i;j++) v += (cl[j]-m[i])**2;
    const sd = Math.sqrt(v/n);
    up.push(m[i]+k*sd); lo.push(m[i]-k*sd); w.push(2*k*sd/m[i]);
  }
  return {m, up, lo, w};
}
function stochRsi(R, n=14){
  const raw = R.map((v,i) => {
    if(v == null || i < n) return null;
    const win = R.slice(i-n+1, i+1); if(win.some(x => x == null)) return null;
    const mn = Math.min(...win), mx = Math.max(...win);
    return mx === mn ? 50 : (v-mn)/(mx-mn)*100;
  });
  const k = smaN(raw, 3);

}
function adx(C, n=14){
  const len = C.length, out = {adx:new Array(len).fill(null), pdi:new Array(len).fill(null), mdi:new Array(len).fill(null)};
  if(len < 2*n+2) return out;
  let tr = 0, pdm = 0, mdm = 0; const dx = [];
  for(let i=1;i<len;i++){
    const up = C[i].h - C[i-1].h, dn = C[i-1].l - C[i].l;
    const p = (up > dn && up > 0) ? up : 0, m = (dn > up && dn > 0) ? dn : 0;
    const t = Math.max(C[i].h - C[i].l, Math.abs(C[i].h - C[i-1].c), Math.abs(C[i].l - C[i-1].c));
    if(i <= n){ tr += t; pdm += p; mdm += m; if(i < n) continue; }
    else { tr = tr - tr/n + t; pdm = pdm - pdm/n + p; mdm = mdm - mdm/n + m; }
    const pdi = tr ? 100*pdm/tr : 0, mdi = tr ? 100*mdm/tr : 0;
    out.pdi[i] = pdi; out.mdi[i] = mdi;
    dx.push({i, v:(pdi+mdi) ? 100*Math.abs(pdi-mdi)/(pdi+mdi) : 0});

  let a = null;
  for(let j=n-1;j<dx.length;j++){ a = j === n-1 ? dx.slice(0,n).reduce((s,x) => s + x.v, 0)/n : (a*(n-1) + dx[j].v)/n; out.adx[dx[j].i] = a; }

function vwap(C, anchorMs){

  for(let i=0;i<C.length;i++){
    const a = Math.floor(C[i].t/anchorMs); if(a !== cur){ cur = a; pv = 0; v = 0; }
    const tp = (C[i].h + C[i].l + C[i].c)/3; pv += tp*C[i].v; v += C[i].v;
    out[i] = v ? pv/v : tp;

}
function supertrend(C, X, m=3){

    const hl = (C[i].h + C[i].l)/2;
    let bu = hl + m*X[i], bl = hl - m*X[i];
    if(up != null){

/* ============================================================
   Price action / SMC
   ============================================================ */
function pivots(C, k){
  const H = [], L = [];
  for(let i=k;i<C.length-k;i++){
    let isH = true, isL = true;
    for(let j=i-k;j<=i+k;j++){
      if(j === i) continue;
      if(j < i ? C[j].h > C[i].h : C[j].h >= C[i].h) isH = false;
      if(j < i ? C[j].l < C[i].l : C[j].l <= C[i].l) isL = false;
    }
    if(isH) H.push({i, p:C[i].h, t:C[i].t});
    if(isL) L.push({i, p:C[i].l, t:C[i].t});
  }
  return {H, L};
}
function structure(pv, C){
  const H = pv.H, L = pv.L;

    const hh = H.at(-1).p > H.at(-2).p, hl = L.at(-1).p > L.at(-2).p;
    if(hh && hl) trend = 'bull'; else if(!hh && !hl) trend = 'bear';
  }
  const lh = H.at(-1), ll = L.at(-1);
  let bi = -1, si = -1;
  if(lh) for(let j=lh.i+1;j<C.length;j++) if(C[j].c > lh.p){ bi = j; break; }
  if(ll) for(let j=ll.i+1;j<C.length;j++) if(C[j].c < ll.p){ si = j; break; }
  let bos = null;
  if(bi >= 0 || si >= 0){
    bos = bi > si ? {dir:'bull', level:lh.p, i:bi, t:C[bi].t} : {dir:'bear', level:ll.p, i:si, t:C[si].t};
    const against = (bos.dir === 'bull' && trend === 'bear') || (bos.dir === 'bear' && trend === 'bull');
    bos.type = against ? 'CHoCH' : 'BOS';
  }
  return {trend, bos};
}
function findSweeps(C, pv){

        let ok = true;
        for(let j=L.i+1;j<i;j++) if(C[j].c < L.p){ ok = false; break; }
        for(let j=i+1;j<n;j++) if(C[j].c < L.p){ ok = false; break; }
        if(ok){ bull = {i, t:C[i].t, level:L.p, wick:C[i].l}; break; }
      }
    }
    if(!bear) for(const H of pv.H){
      if(H.i >= i-2 || H.i < i-80) continue;
      if(C[i].h > H.p && C[i].c < H.p){
        let ok = true;
        for(let j=H.i+1;j<i;j++) if(C[j].c > H.p){ ok = false; break; }
        for(let j=i+1;j<n;j++) if(C[j].c > H.p){ ok = false; break; }
        if(ok){ bear = {i, t:C[i].t, level:H.p, wick:C[i].h}; break; }

    }

function findZones(C, X, P){
  const n = C.length, dem = [], sup = [];

    const c = C[i];
    if(c.c < c.o){ // last red candle before an impulse up -> demand order block
      let mx = -Infinity; for(let j=i+1;j<=i+3;j++) mx = Math.max(mx, C[j].c);
      if(mx - c.o >= 1.5*x && mx > c.h){
        const z = {lo:c.l, hi:c.o, t:c.t};
        let broken = false, visits = 0, inside = false;
        for(let j=i+4;j<n;j++){ if(C[j].c < z.lo){ broken = true; break; } const t = C[j].l <= z.hi; if(t && !inside) visits++; inside = t; }
        if(!broken && visits <= 2) dem.push(z);

    } else if(c.c > c.o){ // last green candle before an impulse down -> supply order block

        let broken = false, visits = 0, inside = false;
        for(let j=i+4;j<n;j++){ if(C[j].c > z.hi){ broken = true; break; } const t = C[j].h >= z.lo; if(t && !inside) visits++; inside = t; }
        if(!broken && visits <= 2) sup.push(z);

    octx.beginPath(); octx.arc(lx, ly, 4 + ph*11, 0, Math.PI*2); octx.stroke();
    octx.fillStyle = '#f6fefd'; octx.beginPath(); octx.arc(lx, ly, 3.5, 0, Math.PI*2); octx.fill();
  }
  octx.restore();
}

let chartTipOn = false;
function hotAt(mx, my){ // lowest priority wins; on a tie the spot whose center is closest to the pointer
  let best = null, bd = Infinity;
  for(const h of hot){
    if(!(mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) || !CHART_TIPS[h.key]) continue;
    const d = Math.abs(my - (h.y + h.h / 2)) + Math.abs(mx - (h.x + h.w / 2)) * 0.01;
    if(!best || h.prio < best.prio || (h.prio === best.prio && d < bd)){ best = h; bd = d; }
  }
  return best;
}
function chartHover(e){
  const r = chartEl.getBoundingClientRect(), h = hotAt(e.clientX - r.left, e.clientY - r.top);
  if(!h){ if(chartTipOn){ hideTip(); chartTipOn = false; } return; }
  const t = CHART_TIPS[h.key];
  tipBox.innerHTML = tr(t[0], t[1]); tipBox.style.display = 'block'; chartTipOn = true;
  const bw = tipBox.offsetWidth, bh = tipBox.offsetHeight;
  let x = e.clientX + 14, yy = e.clientY + 16;
  if(x + bw > innerWidth - 8) x = e.clientX - bw - 14;
  if(yy + bh > innerHeight - 8) yy = e.clientY - bh - 12;
  tipBox.style.left = Math.max(8, x) + 'px'; tipBox.style.top = Math.max(8, yy) + 'px';
}
chartEl.addEventListener('mousemove', chartHover);
chartEl.addEventListener('click', chartHover); // tap on phones
chartEl.addEventListener('mouseleave', () => { if(chartTipOn){ hideTip(); chartTipOn = false; } });

const tip = k => `<span class="tip" tabindex="0" role="button" aria-label="Help" data-tip="${k}">?</span>`;

function showTip(el){
  const t = TIPS[el.dataset.tip]; if(!t) return;
  tipBox.innerHTML = tr(t[0], t[1]); tipBox.style.display = 'block';
  const r = el.getBoundingClientRect(), bw = tipBox.offsetWidth, bh = tipBox.offsetHeight;

      <span class="k">Leverage${tip('lev')}</span><span class="mono">${call.lev}</span>

    </div>

    ${reliabilityNote(call)}

/* live websocket: candles for the open chart + all mids for price alerts */
function connectWS(){
  if(state.ws){ const old = state.ws; state.ws = null; try{ old.close(); }catch(e){} }
  const ws = new WebSocket('wss://api.hyperliquid.xyz/ws');
  state.ws = ws;
  let ping;
  ws.onopen = () => {
    ws.send(JSON.stringify({method:'subscribe', subscription:{type:'candle', coin:state.coin, interval:state.tf}}));
    ws.send(JSON.stringify({method:'subscribe', subscription:{type:'allMids'}}));
    ping = setInterval(() => { try{ ws.send(JSON.stringify({method:'ping'})); }catch(e){} }, 45000);
  };
  ws.onmessage = e => {
    let m; try{ m = JSON.parse(e.data); }catch(_){ return; }
    if(state.ws !== ws) return;
    if(m.channel === 'allMids'){ state.mids = m.data.mids || {}; checkPriceAlertsAll(); paperTick(); return; }
    if(m.channel !== 'candle') return;
    const k = m.data; if(k.s !== state.coin || k.i !== state.tf || state.C.coin !== state.coin) return;
    const c = {t:k.t, o:+k.o, h:+k.h, l:+k.l, c:+k.c, v:+k.v}, C = state.C, last = C.at(-1);
    if(last && c.t === last.t) C[C.length-1] = c;
    else if(!last || c.t > last.t){ C.push(c); setTimeout(runAnalysis, 50); }
    else return;

  const longW = ['long','hore','kúp','kup','buy','odraz','bounce','pump','bull','rast','up','moon','reclaim'];
  const shortW = ['short','dole','predaj','sell','dump','bear','pad','spadne','klesne','down','rejec','drop'];
  const ls = longW.filter(w => t.includes(w)).length, ss = shortW.filter(w => t.includes(w)).length;

async function scanCalls(tf, n, onRow, onProgress){
  if(!state.ctxs.length) await refreshCtx();
  const top = state.ctxs.slice().sort((a,b) => b.vol - a.vol).slice(0, n), rows = [];
  let btcB = null;
  try{ btcB = htfBias(resample(await fetchCandles('BTC', tf, 500), TFMS[HTF[tf]])); }catch(e){}
  let done = 0, next = 0;
  const one = async c => {
    try{
      const C = await fetchCandles(c.name, tf, 500, undefined, {bulk:true});
      if(C.length >= 80){
        const A = analyze(C, resample(C, TFMS[HTF[tf]]), c, tf);
        A.btc = c.name === 'BTC' ? null : btcB;
        const B = bestCall(A);
        rows.push(composeCall(A, B.dir, B.sc, B.plan, c.name));
        if(onRow) onRow(rows);
      }
    }catch(e){ console.warn(c.name, e); }
    done++; if(onProgress) onProgress(done, top.length);
  };
  await Promise.all(Array.from({length:3}, async () => { while(next < top.length){ const c = top[next++]; await one(c); if(!document.hidden) await sleep(120); } }));
  return rows.sort((a,b) => b.score - a.score);
}

function saveToJournal(call){

  prof().journal.unshift({id:Date.now(), created:Date.now(), coin:call.coin, tf:call.tf, dir:call.dir, e1:p.e1, e2:p.e2, sl:p.sl, tp1:p.tp1, tp2:p.tp2, score:call.score, idea:!!state.ideaCall, status:'open', R:0});

function simulate(e, C){
  const L = e.dir === 'long', hit = (c, price, above) => above ? c.h >= price : c.l <= price;
  let st = 'open', entry = null, sl = e.sl, R = 0, e2filled = false, bars = 0;
  for(const c of C){
    if(c.t < e.created) continue;
    bars++;
    if(st === 'open'){
      if(hit(c, e.tp1, L) && !hit(c, e.e1, !L)){ st = 'missed'; break; }
      if(hit(c, e.e1, !L)){ st = 'filled'; entry = e.e1; }
      else { if(bars > 48){ st = 'expired'; break; } continue; }
    }
    if(st === 'filled'){
      if(!e2filled && hit(c, e.e2, !L)){ e2filled = true; entry = (e.e1 + e.e2)/2; }
      if(hit(c, e.sl, !L)){ st = 'sl'; R = -1; break; }
      if(hit(c, e.tp1, L)){ st = 'tp1'; R = 0.5 * Math.abs(e.tp1 - entry) / Math.abs(entry - e.sl); sl = entry; }
      else continue;
    }
    if(st === 'tp1'){
      if(hit(c, e.tp2, L)){ st = 'tp2'; R += 0.5 * Math.abs(e.tp2 - entry) / Math.abs(entry - e.sl); break; }
      if(hit(c, sl, !L)){ st = 'be'; break; }
    }
  }
  return {status:st, R};
}

let editTradeId = null;
function tradeCalc(t){
  const s = t.dir === 'long' ? 1 : -1, px = t.exit ?? (state.mids[t.coin] != null ? +state.mids[t.coin] : ctxOf(t.coin)?.mark);
  if(px == null || !t.entry) return {pnl:null, R:null, px:null};
  if(t.hl && t.hl.state === 'pending' && t.exit == null) return {pnl:null, R:null, px};
  const pnl = t.hl?.pnl != null ? t.hl.pnl : s * (px - t.entry) / t.entry * t.size;
  const R = t.sl ? s * (px - t.entry) / Math.abs(t.entry - t.sl) : null;
  return {pnl, R, px};
}

function drawEquity(pnls, cv = $('#equity')){

const FEE_TAKER = 0.00045, FEE_MAKER = 0.00015; // Hyperliquid base tier
const PP = () => prof().paper;
const midOf = coin => state.mids[coin] != null ? +state.mids[coin] : (ctxOf(coin)?.mark ?? null);
function paperEquity(){
  const pp = PP(); let eq = pp.balance;
  for(const b of pp.brackets){ const m = midOf(b.coin); if(m != null && b.qty > 0) eq += (b.dir === 'long' ? 1 : -1) * (m - b.avg) * b.qty; }
  return eq;
}
function fillLeg(b, leg, px, feeRate){
  leg.filled = true; leg.fillPx = px;
  b.avg = b.qty > 0 ? (b.avg * b.qty + px * leg.qty) / (b.qty + leg.qty) : px;
  b.qty += leg.qty; b.filledQty += leg.qty;
  const fee = px * leg.qty * feeRate; b.fees += fee; b.realized -= fee; PP().balance -= fee;
  b.status = 'open'; b.oneR = b.avg + (b.dir === 'long' ? 1 : -1) * Math.abs(b.avg - b.sl0);
}
function closeQty(b, qty, px, feeRate){
  qty = Math.min(qty, b.qty); if(!(qty > 0)) return;
  const pnl = (b.dir === 'long' ? 1 : -1) * (px - b.avg) * qty, fee = px * qty * feeRate;
  b.qty -= qty; b.realized += pnl - fee; b.fees += fee; PP().balance += pnl - fee;
  b.exitSum = (b.exitSum || 0) + px * qty; b.exitQty = (b.exitQty || 0) + qty;
}
const REASON = () => ({TP2:'TP2 ✓', SL:'SL', BE:'BE', missed:tr('MISSED','UŠIEL'), expired:tr('EXPIRED','EXPIROVAL'), manual:tr('CLOSED','ZAVRETÝ'), cancelled:tr('CANCELLED','ZRUŠENÝ')});
function finalize(b, reason){
  const pp = PP();
  pp.brackets = pp.brackets.filter(x => x !== b);
  const h = {id:b.id, coin:b.coin, dir:b.dir, tf:b.tf, source:b.source, score:b.score, avg:b.avg, exit: b.exitQty ? b.exitSum / b.exitQty : null,
    pnl:b.realized, R: b.riskUsd ? b.realized / b.riskUsd : 0, fees:b.fees, reason, opened:b.created, closed:Date.now(), filled: b.filledQty > 0};
  pp.history.unshift(h); if(pp.history.length > 500) pp.history.length = 500;
  if(b.hl && !h.filled) cancelHlEntries(b);
  notify(`Demo ${b.coin}: ${REASON()[reason] || reason}`, h.filled ? `PnL ${fmtUsd(h.pnl, true)} (${h.R >= 0 ? '+' : ''}${h.R.toFixed(2)}R)` : tr('No fill, order removed', 'Bez vyplnenia, príkaz odstránený'), b.coin);
}
function stepBracket(b, lo, hi, t){
  const L = b.dir === 'long';
  const reach = px => L ? hi >= px : lo <= px, against = px => L ? lo <= px : hi >= px;
  if(b.filledQty === 0 && t > b.expires){ finalize(b, 'expired'); return true; }
  if(!b.r1) for(const leg of b.legs) if(!leg.filled && against(leg.px)) fillLeg(b, leg, leg.px, FEE_MAKER);
  if(b.filledQty === 0){
    if(!b.armed && (L ? lo < b.tp1 : hi > b.tp1)) b.armed = true; // front-run only counts once price was on the entry side of TP1
    if(b.armed !== false && reach(b.tp1)){ finalize(b, 'missed'); return true; } return false;
  }
  if(against(b.sl)){ const be = b.r1; closeQty(b, b.qty, b.sl, FEE_TAKER); finalize(b, be ? 'BE' : 'SL'); return true; } // stop checked first = conservative
  if(!b.t1 && reach(b.tp1)){ closeQty(b, b.filledQty * 0.5, b.tp1, FEE_MAKER); b.t1 = true; b.r1 = true; b.sl = b.avg; } // 50 % at TP1, stop to entry (honest test: better than 35/30/35)
  if(reach(b.tp2)){ closeQty(b, b.qty, b.tp2, FEE_MAKER); finalize(b, 'TP2'); return true; }
  return false;

let autoTimer = null, autoNext = 0, autoBusy = false, autoMsg = '', autoLast = 0;
function dayPnl(){ const d0 = new Date(); d0.setHours(0,0,0,0); return PP().history.filter(h => h.closed >= +d0).reduce((a,h) => a + h.pnl, 0); }
function renderAutoStatus(){
  const el = $('#aStatus'); if(!el) return;
  const a = PP().auto;
  if(!a.on){ el.textContent = tr('Off','Vypnutý'); return; }
  const left = Math.max(0, Math.round((autoNext - Date.now()) / 1000));
  el.textContent = (autoBusy ? tr('Scanning…','Skenujem…') : autoMsg) + (autoBusy || !autoNext ? '' : ` · ${tr('next scan in','ďalší sken o')} ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`);
}
async function autoRun(){
  const pp = PP(), a = pp.auto; if(!a.on || autoBusy) return;
  if(!isPrimary){ autoMsg = tr('Runs in another tab', 'Beží v inom tabe'); renderAutoStatus(); return; }
  autoBusy = true; autoLast = Date.now(); renderAutoStatus();
  try{
    const eq = paperEquity();
    if(dayPnl() <= -eq * a.dayLoss / 100){ autoMsg = tr('Paused: daily loss limit hit, back tomorrow', 'Pauza: denný limit straty, pokračujem zajtra'); return; }
    if(pp.brackets.length >= a.maxPos){ autoMsg = tr(`Full: ${pp.brackets.length}/${a.maxPos} positions`, `Plné: ${pp.brackets.length}/${a.maxPos} pozícií`); return; }
    const tfs = a.tf === '4h+1h' ? ['4h', '1h'] : [a.tf], calls = [];
    for(let k = 0; k < tfs.length; k++){
      if(k) await sleep(45000); // stay under Hyperliquid's API rate limit between the two scans
      calls.push(...await getScan(tfs[k]));
    }
    calls.sort((x, y) => (y.score - tfBonus(y.tf)) - (x.score - tfBonus(x.tf)));
    const picks = calls.filter(c => c.vclass === 'valid' && c.score >= a.minScore + tfBonus(c.tf) && c.plan.rr2 >= 2
      && !(c.price != null && (c.dir === 'long' ? c.price >= c.plan.tp1 : c.price <= c.plan.tp1))); // skip setups whose first target is already behind price (same as the backtest)
    let opened = 0;
    for(const c of picks){
      if(PP().brackets.length >= a.maxPos) break; if(PP().brackets.some(b => b.coin === c.coin)) continue;
      if(PP().brackets.filter(b => b.dir === c.dir).length >= (a.dirCap || 2)) continue; // max 2 positions one way: correlated stop-outs
      if(PP().history.some(h => h.coin === c.coin && h.reason === 'SL' && Date.now() - h.closed < 864e5)) continue; // 24h pause on a coin after its stop loss (helps in- and out-of-sample)
      const nb = openPaper(c, 'auto'); if(!nb) continue; opened++;
      if(a.liveTestnet) await autoLiveTestnet(c, nb);
    }
    const best = calls[0];
    autoMsg = opened ? tr(`Opened ${opened} trade(s)`, `Otvorené obchody: ${opened}`)
      : tr(`No setup ≥ ${a.minScore} pts (best: ${best ? best.coin + ' ' + best.score.toFixed(1) : '–'}). Waiting.`, `Žiadny setup ≥ ${a.minScore} b. (najlepší: ${best ? best.coin + ' ' + best.score.toFixed(1) : '–'}). Čakám.`);
  }catch(e){ autoMsg = tr('Error: ','Chyba: ') + e.message; }
  finally{ autoBusy = false; autoNext = Date.now() + (+a.every || 10) * 60000; renderAutoStatus(); }
}
function setAuto(on){
  clearInterval(autoTimer); autoTimer = null; autoNext = 0; autoMsg = '';
  if(on){ autoRun(); autoTimer = setInterval(() => {
    const d = new Date(), afterClose = d.getMinutes() === 1 && Date.now() - autoLast > 5 * 60000; // right after a 1h / 4h candle closes
    if(Date.now() >= autoNext || afterClose) autoRun(); else renderAutoStatus();
  }, 1000); }
  renderAutoStatus();
}

async function hlSign(action, nonce, isMainnet, wallet){
  const packed = MessagePack.encode(action);
  const data = new Uint8Array(packed.length + 9);
  data.set(packed, 0);
  new DataView(data.buffer).setBigUint64(packed.length, BigInt(nonce));
  data[packed.length + 8] = 0; // no vault address
  const sig = await wallet.signTypedData(
    {name:'Exchange', version:'1', chainId:1337, verifyingContract:'0x0000000000000000000000000000000000000000'},
    {Agent:[{name:'source', type:'string'}, {name:'connectionId', type:'bytes32'}]},
    {source: isMainnet ? 'a' : 'b', connectionId: ethers.keccak256(data)});
  const sg = ethers.Signature.from(sig);
  return {r:sg.r, s:sg.s, v:sg.v};
}
async function hlExchange(action){

  const nonce = Date.now();
  const signature = await hlSign(action, nonce, c.net === 'mainnet', wallet);
  const r = await fetch(HLURL[c.net] + '/exchange', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action, nonce, signature, vaultAddress:null})});
  const d = await r.json().catch(() => ({status:'err', response:'HTTP ' + r.status}));
  if(d.status !== 'ok') throw new Error(typeof d.response === 'string' ? d.response : JSON.stringify(d.response));
  const sts = d.response?.data?.statuses;
  if(Array.isArray(sts)){ const errs = sts.filter(x => x && x.error).map(x => x.error); if(errs.length) throw new Error(errs.join('; ')); }
  return d;
}

let hlSyncBusy = false;
async function syncHlTrades(){
  const c = hlCfg(); if(!c.addr || hlSyncBusy || !isPrimary) return;
  const T = prof().trades.filter(t => t.hl && t.exit == null && t.hl.net === c.net); if(!T.length) return;
  hlSyncBusy = true;
  try{
    const [st, oo, fills] = await Promise.all([hlInfo({type:'clearinghouseState', user:c.addr}), hlInfo({type:'frontendOpenOrders', user:c.addr}), hlInfo({type:'userFills', user:c.addr})]);
    const resting = new Set((oo || []).map(o => o.oid)); let changed = false;
    for(const t of T){
      const prev = t.hl.state, pos = (st.assetPositions || []).map(x => x.position).find(x => x.coin === t.coin && +x.szi !== 0);
      const mine = (fills || []).filter(f => f.coin === t.coin && f.time >= t.hl.placed - 5000);
      if(pos){ t.hl.state = 'open'; if(+pos.entryPx) t.entry = +pos.entryPx; }
      else if(t.hl.oids.some(o => resting.has(o))) t.hl.state = 'pending';
      else if(prev === 'open' || mine.some(f => t.hl.oids.includes(f.oid)) || !t.hl.oids.length){
        const closes = mine.filter(f => +f.closedPnl !== 0);
        if(closes.length){ const q = closes.reduce((a, f) => a + +f.sz, 0); t.exit = closes.reduce((a, f) => a + +f.px * +f.sz, 0) / q; t.closed = Math.max(...closes.map(f => f.time)); t.hl.pnl = closes.reduce((a, f) => a + +f.closedPnl, 0) - mine.reduce((a, f) => a + +f.fee, 0); t.hl.state = 'closed'; }
      } else if(Date.now() - t.hl.placed > 90000){ t.hl.state = 'cancelled'; t.exit = t.entry; t.closed = Date.now(); t.notes = (t.notes || '') + tr(' · cancelled on Hyperliquid', ' · zrušené na Hyperliquide'); }
      if(t.hl.state !== prev){
        changed = true;
        notify(`Hyperliquid ${t.coin}: ${hlStateLabel(t.hl.state)}`, t.hl.state === 'closed' ? `PnL ${fmtUsd(t.hl.pnl, true)} · exit ${fmt(t.exit)}` : t.hl.state === 'open' ? `${tr('filled at','vyplnené za')} ${fmt(t.entry)}` : '', t.coin);
      }
    }
    if(changed){ persist(); renderTrades(); }
  }catch(e){ console.warn('hl sync', e); }
  finally{ hlSyncBusy = false; }
}

/* ============================================================
   Backtest
   ============================================================ */
function simTrade(plan, dir, C, i0, maxWait){ // same exits as the demo, PnL in R (1R = planned loss of the full position)
  const L = dir === 'long', s = L ? 1 : -1, Q = 1 / Math.abs(plan.avg - plan.sl);
  const legs = [{px:plan.e1, q:Q/2, f:false}, {px:plan.e2, q:Q/2, f:false}];
  let qty = 0, filled = 0, avg = 0, pnl = 0, sl = plan.sl, r1 = false, t1 = false, oneR = null;
  const fill = leg => { avg = qty > 0 ? (avg * qty + leg.px * leg.q) / (qty + leg.q) : leg.px; qty += leg.q; filled += leg.q; leg.f = true; pnl -= leg.px * leg.q * FEE_MAKER; oneR = avg + s * Math.abs(avg - plan.sl); };
  const close = (q, px, fee) => { q = Math.min(q, qty); pnl += s * (px - avg) * q - px * q * fee; qty -= q; };
  for(let j = i0 + 1; j < C.length; j++){
    const c = C[j], reach = px => L ? c.h >= px : c.l <= px, against = px => L ? c.l <= px : c.h >= px;
    if(filled === 0 && j - i0 > maxWait) return {R:0, reason:'expired', j, filled:false};
    const before = filled;
    if(!r1) for(const leg of legs) if(!leg.f && against(leg.px)) fill(leg);
    if(filled === 0){ if(reach(plan.tp1)) return {R:0, reason:'missed', j, filled:false}; continue; }
    if(against(sl)){ const be = r1; close(qty, sl, FEE_TAKER); return {R:pnl, reason: be ? 'BE' : 'SL', j, filled:true}; } // stop first = conservative
    if(before === 0) continue; // filled in this candle: we can't know if the target came first, so targets count from the next candle
    if(!t1 && reach(plan.tp1)){ close(filled * 0.5, plan.tp1, FEE_MAKER); t1 = true; r1 = true; sl = avg; }
    if(reach(plan.tp2)){ close(qty, plan.tp2, FEE_MAKER); return {R:pnl, reason:'TP2', j, filled:true}; }
  }
  if(filled === 0) return {R:0, reason:'open', j:C.length - 1, filled:false};
  close(qty, C.at(-1).c, 0); return {R:pnl, reason:'open', j:C.length - 1, filled:true};
}
let btAbort = false;
async function backtestCoin(coin, tf, minScore, onProg){
  const C = await fetchCandles(coin, tf, 5000, undefined, {bulk:true}), W = 400, htfMs = TFMS[HTF[tf]], trades = [];
  let i = W, k = 0;
  while(i < C.length - 2 && !btAbort){
    const win = C.slice(i - W + 1, i + 1);
    let B = null;
    let A = null;
    try{ A = analyze(win, resample(win, htfMs), null, tf); B = bestCall(A); }catch(e){}
    const adxMin = +S().adxMin || 0;
    if(B && B.sc.score >= minScore && B.plan.rr2 >= 2 && (!adxMin || (A.ind.adx != null && A.ind.adx >= adxMin))){
      const r = simTrade(B.plan, B.dir, C, i, 48);
      trades.push({coin, t:C[i].t, dir:B.dir, score:B.sc.score, R:r.R, reason:r.reason, filled:r.filled, e1:B.plan.e1});
      i = r.j + 1;
    } else i++;
    if(onProg && ++k % 25 === 0){ onProg((i - W) / (C.length - W)); await sleep(0); } // yield only when a progress bar is shown
  }
  return {coin, trades, from:C[0]?.t, to:C.at(-1)?.t, bars:C.length};
}
function btSummary(trades){
  const f = trades.filter(t => t.filled), Rs = f.map(t => t.R), wins = Rs.filter(r => r > 0);
  const total = Rs.reduce((a,b) => a + b, 0), gw = wins.reduce((a,b) => a + b, 0), gl = -Rs.filter(r => r < 0).reduce((a,b) => a + b, 0);
  let peak = 0, cur = 0, dd = 0; for(const r of Rs){ cur += r; peak = Math.max(peak, cur); dd = Math.max(dd, peak - cur); }
  return {n:f.length, win: f.length ? wins.length / f.length : 0, avg: f.length ? total / f.length : 0, total, pf: gl ? gw / gl : (gw ? Infinity : 0), dd, skipped: trades.length - f.length, Rs};
}

function mdLite(t){
  const lines = esc(t).split('\n'); let html = '', inList = false;
  for(let l of lines){
    l = l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^#{1,4}\s*(.+)$/, '<b>$1</b>');
    if(/^\s*[-•*]\s+/.test(l)){ if(!inList){ html += '<ul>'; inList = true; } html += '<li>' + l.replace(/^\s*[-•*]\s+/, '') + '</li>'; }
    else { if(inList){ html += '</ul>'; inList = false; } if(l.trim()) html += '<p>' + l + '</p>'; }
  }
  return html + (inList ? '</ul>' : '');
}
function aiHeaders(){
  const h = {'content-type':'application/json', 'x-api-key':S().aiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'};
  if(!String(S().aiModel || '').startsWith('claude-haiku')) h['anthropic-beta'] = 'server-side-fallback-2026-07-01';
  return h;
}
function aiBody(system, messages){
  const model = S().aiModel || 'claude-haiku-5-5', haiku = model.startsWith('claude-haiku');
  const b = {model, max_tokens:8000, output_config:{effort: haiku ? 'low' : 'medium'}, system, messages};
  if(S().aiNews !== false) b.tools = [{type: haiku ? 'web_search_20250305' : 'web_search_20260209', name:'web_search', max_uses:3}];
  if(!haiku) b.fallbacks = 'default'; // retry on another model if a safety classifier declines
  return b;
}

  const A = state.A, call = state.ideaCall || state.call; if(!A || !call) return;
  const out = $('#aiOut'); out.innerHTML = `<span class="spin"></span> ${tr('Claude is reading the chart and the news…','Claude analyzuje graf a číta správy…')}`;
  $('#btnAI').disabled = true;
  const ctx = ctxOf(state.coin) || {};
  const payload = {
    coin: state.coin, timeframe: state.tf, higherTimeframe: A.htfTf, price: A.P, atr: A.atr, rsi: A.rsi, ema21: A.e21, ema50: A.e50, ema200: A.e200,
    htfBias: {score:A.htf.score, trend:A.htf.trend}, multiTimeframe: state.mtf ? Object.fromEntries(Object.entries(state.mtf).map(([k,b]) => [k, b.trend])) : null,
    localStructure: A.st.trend, lastBreak: A.st.bos, sweeps: A.sweeps, demandZones: A.zones.dem, supplyZones: A.zones.sup, fvg: A.fvg,
    volumeProfile: A.vp ? {poc:A.vp.poc, vah:A.vp.vah, val:A.vp.val} : null, fib: A.fib, indicators: A.ind,

    patternsLastCandle: A.pat, rsiDivergence: A.div, btcBias: A.btc ? A.btc.trend : null,
    fundingPerHour: ctx.funding, openInterestUsd: ctx.oi, change24hPct: ctx.prev ? pct(A.P, ctx.prev) : null,
    botCall: {direction: call.dir, verdict: call.verdict, confluenceScore: call.score, plan: call.plan, reasons: call.reasons.map(r => `${r.w > 0 ? '+' : ''}${r.w} ${r.txt}`)},
    userIdea: idea || null, now: new Date().toISOString(),
  };
  const langName = LANG === 'sk' ? 'Slovak' : 'English';
  const system = `You are J.A.R.V.I.S., a personal AI assistant in the style of Iron Man's (calm, witty, precise; address the user as "${LANG === 'sk' ? 'šéfe' : 'sir'}") and an experienced crypto futures trader (price action, smart money concepts, liquidity, order blocks, FVG, market structure, volume profile POC/VAH/VAL, range trading, Fibonacci, BTC dominance for alts).

2. Combine technicals and news and give a verdict on whether the call makes sense.
Format (max ~250 words total):
**Verdict:** one sentence (Taking it / Waiting / I'd pass)
**What's happening:** 2-4 bullets, only relevant items
**Technicals:** 2-3 bullets with what matters most on the chart

**What would kill it:** 1-2 bullets

  }catch(e){
    out.innerHTML = `<span class="down">⚠️ ${esc(e.message)}</span>`;
  }finally{ $('#btnAI').disabled = false; }
}
