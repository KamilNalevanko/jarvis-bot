let fb = null;
const cloudConfig = () => FIREBASE_CONFIG || loadJSON('jv_fbcfg', null);
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Failed to load ' + src)); document.head.appendChild(s); }); }
async function initCloud(){
  if(fb) return fb;
  const cfg = cloudConfig(); if(!cfg) return null;
  const v = '10.12.2';
  await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);
  firebase.initializeApp(cfg);
  fb = {auth:firebase.auth(), db:firebase.firestore(), user:null};
  fb.auth.onAuthStateChanged(u => onCloudUser(u));
  fb.auth.getRedirectResult().catch(e => toast(e.message));

}
async function googleSignIn(){
  if(!cloudConfig()){ openSettings('cloud'); const d = $('#mSettings details'); if(d) d.open = true; toast(tr('Google sign-in needs a one-time setup, see below.','Google prihlásenie treba raz nastaviť, pozri nižšie.')); return; }
  try{
    await initCloud();
    const prov = new firebase.auth.GoogleAuthProvider();
    try{ await fb.auth.signInWithPopup(prov); }
    catch(e){ if(/popup|operation-not-supported/i.test(e.code || '')) await fb.auth.signInWithRedirect(prov); else throw e; }
  }catch(e){ toast(e.message); }
}
async function onCloudUser(u){
  fb.user = u;
  if(u){
    const cloud = {uid:u.uid, email:u.email, photo:u.photoURL};
    let p = profiles.find(x => x.cloud?.uid === u.uid), remote = null;
    try{ const snap = await fb.db.collection('users').doc(u.uid).get(); if(snap.exists) remote = snap.data().profile; }catch(e){ console.warn(e); }
    if(!p){
      const cur = prof();
      if(!cur.cloud && !remote){ p = cur; p.name = cur.name === 'Trader' ? (u.displayName || cur.name) : cur.name; }
      else { p = remote ? {...newProfile(), ...remote} : newProfile(u.displayName || 'Trader'); profiles.push(p); }
    }
    if(remote && (remote.updated || 0) > (p.updated || 0)){ const key = p.settings?.aiKey || ''; Object.assign(p, remote); p.settings = {...DEF_SETTINGS, ...remote.settings, aiKey:key}; }
    p.cloud = cloud;
    activeId = p.id; saveJSON('jv_profiles', profiles); saveJSON('jv_active', activeId);

  }
  renderProfileBtn(); renderCloudState();
}
let syncT;
function cloudSync(now){

    const p = JSON.parse(JSON.stringify(prof())); p.settings.aiKey = '';

$('#sColors').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if(!b) return; pickColor = b.dataset.c; $$('#sColors button').forEach(x => x.classList.toggle('on', x === b)); document.documentElement.style.setProperty('--mint', pickColor); });
$('#sNotif').onclick = async () => { if('Notification' in window){ try{ await Notification.requestPermission(); }catch(e){} $('#sNotifState').textContent = Notification.permission; } };
$('#sCancel').onclick = () => { $('#mSettings').classList.remove('on'); applyScale(); renderProfileBtn(); };
$('#sSave').onclick = () => {
  const s = S(), p = prof();
  if(!FIREBASE_CONFIG){
    const raw = $('#sFb').value.trim();
    if(raw){
      try{
        const obj = raw.slice(raw.indexOf('{'), raw.lastIndexOf('}') + 1);
        let cfg; try{ cfg = JSON.parse(obj); }catch(_){ cfg = Function('"use strict";return (' + obj + ')')(); } // accepts the JS object Firebase shows
        if(!cfg.apiKey || !cfg.projectId) throw new Error('missing apiKey / projectId');
        saveJSON('jv_fbcfg', cfg);
      }catch(e){ toast(tr('Firebase config is not valid JSON: ','Firebase config nie je platný JSON: ') + e.message); return; }
    } else { try{ localStorage.removeItem('jv_fbcfg'); }catch(e){} }
  }
  p.name = $('#sName').value.trim() || p.name; if(pickColor) p.color = pickColor;
  s.lang = $('#sLang').value; s.uiScale = +$('#sScale').value || 1;
  s.account = num($('#sAcc').value) ?? s.account; s.risk = num($('#sRisk').value) ?? s.risk;
  s.maxLev = Math.max(1, Math.min(100, num($('#sMaxLev').value) || 25)); s.minScore = Math.max(4, Math.min(14, num($('#sMinScore').value) || 8)); s.adxMin = +$('#sAdx').value;
  s.sound = $('#sSound').checked; s.scanMin = +$('#sScanMin').value;
  s.showVP = $('#sVP').checked; s.showZones = $('#sZones').checked; s.showEMA = $('#sEMA').checked; s.showBox = $('#sBox').checked;
  s.aiKey = $('#sKey').value.trim();
  try{ saveHlFromForm(); }catch(e){ showSTab('hl'); toast(e.message); return; } s.aiModel = $('#sModel').value; s.aiNews = $('#sNews').checked;
  s.showPatterns = $('#sPat').checked; s.showMacro = $('#sMacro').checked;
  s.showInd = $('#sInd').checked; s.showWhy = $('#sWhy').checked; s.showCalc = $('#sCalc').checked; s.showTop = $('#sTop').checked; s.showAI = $('#sAI').checked;
  persist(); $('#mSettings').classList.remove('on');
  applyProfile(true);
  if(cloudConfig() && !fb) initCloud().catch(e => toast(e.message));
  toast(tr('Saved','Uložené'));
};
$('#sScale').onchange = e => applyScale(+e.target.value); // live preview while the dialog is open
$('#sGoogle').onclick = () => { $('#mSettings').classList.remove('on'); googleSignIn(); };
$('#sSignOut').onclick = async () => { if(fb?.user){ await fb.auth.signOut(); toast(tr('Signed out','Odhlásený')); renderCloudState(); renderProfileBtn(); } };
$('#sExport').onclick = () => {
  const p = JSON.parse(JSON.stringify(prof())); p.settings.aiKey = '';
  const blob = new Blob([JSON.stringify({app:'jarvis', v:1, profile:p}, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `jarvis-${(p.name || 'profile').replace(/\W+/g,'-').toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
};
$('#sImport').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text()), src = d.profile || d;
    if(!src.settings) throw new Error('not a J.A.R.V.I.S. backup');
    const p = {...newProfile(src.name), ...src, id:newProfile().id, cloud:null};
    p.settings = {...DEF_SETTINGS, ...src.settings};
    profiles.push(p); activeId = p.id; persist(); $('#mSettings').classList.remove('on'); applyProfile();
    toast(tr(`Imported "${p.name}"`, `Importované „${p.name}“`));
  }catch(err){ toast(tr('Import failed: ','Import zlyhal: ') + err.message); }
  e.target.value = '';
};

/* apply the active profile everywhere */
function applyProfile(keepChart){
  const s = S();
  LANG = s.lang; applyI18n();
  $('#cAcc').value = s.account; $('#cRisk').value = s.risk;
  $('#tCoin').value ||= state.coin; $('#paCoin').value ||= state.coin;
  applyChartPrefs(); renderProfileBtn(); renderJournal(); renderTrades(); renderPriceAlerts(); renderCloudState();
  loadAutoUI(); renderDemo(); setAuto(!!prof().paper.auto.on); live.st = null; renderLive();
  $('#autoScan').checked = false; setAutoScan(false);
  if(!keepChart && (s.coin !== state.coin || s.tf !== state.tf)){ state.coin = s.coin; state.tf = s.tf; syncCoinUI(); load(); }
  else if(state.A){ const hadIdea = !!state.ideaCall; runAnalysis(); if(hadIdea) checkIdea(); }
}

/* ============================================================
   Coin picker, timeframe, tabs
   ============================================================ */
let coinFilter = 'all';
const MEMES = ['DOGE','KPEPE','PEPE','WIF','KBONK','BONK','POPCAT','FARTCOIN','PENGU','KSHIB','SHIB','TRUMP','MEW','BRETT','MOODENG','PNUT','GOAT','SPX','TURBO','KFLOKI','FLOKI','CHILLGUY','MELANIA','PUMP','AI16Z','KNEIRO','NEIRO','MOG','KMOG','BOME','MEME','GRIFFAIN','ZEREBRO','VINE','USELESS','FWOG','PURR','KLUNC','DOOD','HPOS','TST','BABY','ANIME','VIRTUAL','AIXBT','YZY','WLFI'];
function renderCoinList(){
  const q = $('#coinSearch').value.trim().toUpperCase(), favs = S().favs;
  let list = state.ctxs.slice();
  if(q) list = list.filter(c => c.name.toUpperCase().includes(q));
  const chg = c => c.prev ? pct(c.mark, c.prev) : 0;
  if(coinFilter === 'fav') list = list.filter(c => favs.includes(c.name));
  if(coinFilter === 'meme') list = list.filter(c => MEMES.includes(c.name.toUpperCase()));
  if(coinFilter === 'gain') list.sort((a,b) => chg(b) - chg(a));
  else if(coinFilter === 'lose') list.sort((a,b) => chg(a) - chg(b));
  else list.sort((a,b) => (favs.includes(b.name) - favs.includes(a.name)) || (b.vol - a.vol));
  if(q) list.sort((a,b) => ((b.name.toUpperCase() === q) - (a.name.toUpperCase() === q)) || (b.name.toUpperCase().startsWith(q) - a.name.toUpperCase().startsWith(q)) || (b.vol - a.vol));
  $('#clist').innerHTML = `<div class="crow head"><span></span><span>Coin</span><span class="r">${tr('Price','Cena')}</span><span class="r">24h</span><span class="r">${tr('Volume','Objem')}</span></div>` +
    (list.slice(0, 250).map((c, i) => { const ch = chg(c); return `<div class="crow${i === 0 && q ? ' sel' : ''}" data-coin="${esc(c.name)}">
      <span class="star${favs.includes(c.name) ? ' on' : ''}" data-star="${esc(c.name)}">★</span>
      <span class="nm">${esc(c.name)}</span><span class="r">${fmt(c.mark)}</span>
      <span class="r ${ch >= 0 ? 'up' : 'down'}">${ch >= 0 ? '+' : ''}${ch.toFixed(2)}%</span>
      <span class="r muted">${fmtUsd(c.vol)}</span></div>`; }).join('') || `<div class="empty">${tr('Nothing found','Nič sa nenašlo')}</div>`);
}
function openCoins(){ $('#cpanel').classList.add('on'); $('#pmenu').classList.remove('on'); $('#coinSearch').value = ''; renderCoinList(); if(window.innerWidth > 700) setTimeout(() => $('#coinSearch').focus(), 0); }
function closeCoins(){ $('#cpanel').classList.remove('on'); }
$('#coinBtn').onclick = e => { e.stopPropagation(); $('#cpanel').classList.contains('on') ? closeCoins() : openCoins(); };
$('#cpanel').addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => { closeCoins(); $('#pmenu').classList.remove('on'); });
$('#coinSearch').addEventListener('input', renderCoinList);
$('#coinSearch').addEventListener('keydown', e => {
  if(e.key === 'Escape') closeCoins();
  if(e.key === 'Enter'){ const first = $('#clist .crow[data-coin]'); if(first){ closeCoins(); setCoin(first.dataset.coin); } }
});
$('#cfilters').addEventListener('click', e => {
  const b = e.target.closest('button[data-f]'); if(!b) return;
  coinFilter = b.dataset.f; $$('#cfilters button').forEach(x => x.classList.toggle('on', x === b)); renderCoinList();
});
$('#clist').addEventListener('click', e => {
  const st = e.target.closest('[data-star]');
  if(st){ const n = st.dataset.star, s = S(); s.favs = s.favs.includes(n) ? s.favs.filter(x => x !== n) : [...s.favs, n]; persist(); renderCoinList(); return; }
  const r = e.target.closest('.crow[data-coin]'); if(r){ closeCoins(); setCoin(r.dataset.coin); }
});
function syncCoinUI(){
  $('#coinBtn span').textContent = state.coin;
  $$('#tfs button').forEach(x => x.classList.toggle('on', x.dataset.tf === state.tf));
}
function setCoin(c){
  c = (c || '').trim(); if(!c) return;
  const known = state.ctxs.find(x => x.name.toUpperCase() === c.toUpperCase());
  if(state.ctxs.length && !known){ toast(tr(`${c} not found`, `${c} sa nenašiel`)); return; }
  if(known) c = known.name;
  state.coin = c; S().coin = c; persist(); syncCoinUI();
  $('#ideaOut').innerHTML = ''; state.ideaActive = null; $('#tCoin').value = c; $('#paCoin').value = c;
  if(window.innerWidth <= 1050) window.scrollTo({top:0, behavior:'smooth'});
  load();
}
$('#tfs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tf]'); if(!b) return;
  state.tf = b.dataset.tf; S().tf = state.tf; persist(); syncCoinUI(); load();
});
$('#mnav').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if(!b) return;
  const g = b.dataset.go, to = el => el && el.scrollIntoView({block:'start'});
  if(g === 'chart') document.querySelector('header').scrollIntoView({block:'start'});
  else if(g === 'call') to($('#callCard'));
  else if(g === 'top') to($('#topCard'));
  else { openTab(g); to($('#tabs')); }
  $$('#mnav button').forEach(x => x.classList.toggle('on', x === b));
});
function openTab(name){
  $$('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === name));
  $$('.tabpane').forEach(p => p.classList.toggle('on', p.id === 'tab-' + name));
  if(name === 'journal') evalJournal();
  if(name === 'trades'){ renderTrades(); syncHlTrades(); }
  if(name === 'demo') renderDemo();
  if(name === 'bt'){ $('#btTf').value = ['15m','1h','4h'].includes(state.tf) ? state.tf : '4h'; $('#btMin').value = (+S().minScore || 9) + tfBonus($('#btTf').value); }
  if(name === 'real') refreshLive();
  $('.bottom').scrollIntoView({behavior:'smooth', block:'start'});
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if(b) openTab(b.dataset.tab); });
$('#langSw').addEventListener('click', e => { const b = e.target.closest('button[data-lang]'); if(!b) return; S().lang = b.dataset.lang; persist(); applyProfile(true); });
$('#fitBtn').onclick = fitChart;
$('#toTabs').onclick = () => $('.bottom').scrollIntoView({behavior:'smooth', block:'start'});
$('#btnAnalyze').onclick = () => { state.forceDir = null; state.ideaCall = null; load(); };
$('#btnIdea').onclick = checkIdea;
$('#btnIdeaAI').onclick = () => { const t = $('#ideaText').value.trim(); if(!t){ toast(tr('Write your idea first','Najprv napíš ideu')); return; } if(checkIdea()) askAI(t); };
$('#btnAI').onclick = () => askAI(null);
$('#btnScan').onclick = runScan;
$('#btnAlerts').onclick = toggleAlerts;
$('#btnSettings').onclick = () => openSettings();
$('#autoScan').onchange = e => setAutoScan(e.target.checked);
$('#cAcc').oninput = e => { S().account = +e.target.value; persist(); renderCalc(); };
$('#cRisk').oninput = e => { S().risk = +e.target.value; persist(); renderCalc(); };
$$('.modal').forEach(m => m.addEventListener('click', e => { if(e.target === m && m.id !== 'mConfirm') m.classList.remove('on'); }));
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') $$('.modal.on').forEach(m => { if(m.id !== 'mConfirm') m.classList.remove('on'); });
  if(e.key === '/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){ e.preventDefault(); openCoins(); }
  if((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) fitChart();
});

(async function init(){
  isPrimary = claimPrimary(false);
  if(isPrimary) setInterval(() => { if(isPrimary) claimPrimary(true); }, 20000); // heartbeat
  else {
    document.body.insertAdjacentHTML('afterbegin', `<div id="viewBar" style="position:sticky;top:0;z-index:60;background:var(--amber);color:#2a1a00;padding:8px 16px;font-weight:700;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap">👁 ${tr('View-only: J.A.R.V.I.S. (autopilot, demo, testnet) is running in another tab. This tab refreshes the data every 10 s.', 'Len na pozeranie: J.A.R.V.I.S. (autopilot, demo, testnet) beží v inom tabe. Tento tab obnovuje dáta každých 10 s.')}<button class="btn sm" id="takeOver" style="background:#2a1a00;color:var(--amber);border-color:#2a1a00">${tr('Run it here instead', 'Spustiť radšej tu')}</button></div>`);
    $('#takeOver').onclick = () => { claimPrimary(true); location.reload(); };
    setInterval(() => { // mirror what the primary tab saved
      const fresh = loadJSON('jv_profiles', null); if(!Array.isArray(fresh)) return;
      profiles = fresh; profiles.forEach(p => { p.settings = {...DEF_SETTINGS, ...(p.settings || {})}; p.paper ||= newPaper(); });
      renderDemo(); renderJournal(); renderTrades(); renderPriceAlerts(); loadAutoUI();
      if(!loadJSON('jv_primary', null) || Date.now() - loadJSON('jv_primary', null).t > 60000){ claimPrimary(true); location.reload(); } // primary closed: take over
    }, 10000);
  }
  initSidePanel();
  syncCoinUI();
  applyProfile(true);
  await refreshCtx();
  await load();
  paperCatchUp();
  setInterval(() => { if($('#tab-real').classList.contains('on')) refreshLive(); }, 5000);
  setInterval(syncHlTrades, 30000); setTimeout(syncHlTrades, 4000);
  setInterval(refreshCtx, 30000);
  loadMacro(); setInterval(loadMacro, 3600000); setInterval(renderMacro, 60000);
  setTimeout(() => refreshTop(), 3000); setInterval(() => refreshTop(), 15 * 60000);
  setInterval(() => { if(isPrimary && prof().paper.brackets.length) saveJSON('jv_profiles', profiles); }, 30000);
  setInterval(() => { if(state.C.length && !state.loading) runAnalysis(); }, 60000);
  setInterval(() => { if($('#tab-trades').classList.contains('on')) renderTrades(); }, 5000);
  if(cloudConfig()) initCloud().catch(e => console.warn(e));
})();
</script>
